[project]
name = "patient-voice-agent"
version = "1.0.0"
description = "Voice AI agent for patient registration: Vapi telephony + LangChain/OpenRouter agent + FastAPI + Supabase Postgres"
license = "MIT"
authors = [
    {name = "Nabeel Imran", email = "nabeel.imran8521@gmail.com"}
]
readme = "README.md"

requires-python = ">=3.11,<3.12"
dependencies = [
    # Web framework (FastCrate base)
    "fastapi[standard]>=0.115.11",
    "uvicorn[standard]>=0.34.0",
    "gunicorn>=23.0.0 ; sys_platform == \"linux\"",
    # Data layer
    "sqlmodel>=0.0.24",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.4",
    "alembic>=1.14.0",
    # Settings / validation
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "email-validator>=2.2",
    "python-dotenv>=1.0.1",
    # Auth
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.2.1",
    # HTTP client (Vapi API)
    "httpx>=0.28",
    # LLM: LangChain agent + post-call analysis via OpenRouter (OpenAI-compatible)
    "langchain-core>=0.3.60",
    "langchain-openai>=0.3.20",
    "openai>=1.78.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.uv]
package = false
